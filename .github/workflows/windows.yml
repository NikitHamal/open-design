name: Windows Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      HUSKY: "0"
      CI: "true"
      VER: 0.27.${{ github.run_number }}
      TAG: v0.27.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Stamp release version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.VER;
            for (const p of ["package.json", "apps/packaged/package.json", "apps/desktop/package.json", "apps/daemon/package.json", "apps/web/package.json"]) {
              if (!fs.existsSync(p)) continue;
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = ver;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
          '

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck daemon and web
        shell: bash
        run: |
          pnpm --filter @open-design/daemon exec tsc -p tsconfig.json --noEmit
          pnpm --filter @open-design/web exec tsc -b --noEmit

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Package
        run: pnpm tools-pack win build --to nsis

      - name: Size report
        shell: bash
        continue-on-error: true
        run: |
          U=$(find .tmp/tools-pack/out/win -type d -name win-unpacked | head -1)
          echo "unpacked: $U"; du -sm "$U"
          du -m --max-depth=4 "$U/resources" | sort -rn | head -40

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          SETUP=$(find .tmp/tools-pack/out/win -maxdepth 4 -name "*setup*.exe" -not -path "*win-unpacked*" | head -1)
          cp "$SETUP" out/OpenDesign-setup.exe
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: opendesigns-windows
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: "OpenDesign ${{ env.TAG }}"
          body: |
            Automated Windows build of **OpenDesign** (Standalone Local Workspace with Built-in Zeus Engine & 41 Free Keyless Providers).

            - `OpenDesign-setup.exe` — Windows x64 installer with auto-update support
          draft: false
          prerelease: false
          files: out/*
