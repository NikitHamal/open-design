name: Windows Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HUSKY: "0"
      CI: "true"
      VER: 0.27.${{ github.run_number }}
      TAG: v0.27.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp release version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VER;
            const edit = (p, fn) => fs.writeFileSync(p, fn(fs.readFileSync(p, "utf8")));
            edit("package.json", (s) => s.replace(/"version": "[^"]+"/, `"version": "${v}"`));
            edit("src-tauri/tauri.conf.json", (s) => s.replace(/"version": "[^"]+"/, `"version": "${v}"`));
            edit("src-tauri/Cargo.toml", (s) => s.replace(/^version = "[^"]+"/m, `version = "${v}"`));
          '

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck daemon and web
        shell: bash
        run: |
          pnpm --filter @open-design/daemon exec tsc -p tsconfig.json --noEmit
          pnpm --filter @open-design/web exec tsc -b --noEmit

      - name: Build payload
        run: node scripts/build-app.mjs

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@2 icon ../apps/web/public/app-icon.png
        working-directory: src-tauri
        env:
          TAURI_CONFIG: "{}"

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          projectPath: .
          tagName: ${{ env.TAG }}
          releaseName: "OpenDesign ${{ env.TAG }}"
          releaseBody: "Windows x64 installer. Installed copies update themselves from this release."
          releaseDraft: false
          prerelease: false

      - name: Report installer size
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          find src-tauri/target -name "*setup.exe" -exec ls -l {} \;
          du -sm .stage/app .stage/node
