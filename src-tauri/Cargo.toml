[package]
name = "opendesigns"
version = "0.27.0"
description = "OpenDesign - local-first AI design workspace"
edition = "2021"

[lib]
name = "opendesigns_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
