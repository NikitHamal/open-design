<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  html, body { height: 100%; margin: 0; background: #141218; }
  @media (prefers-color-scheme: light) { html, body { background: #fef7ff; } }
  .s { position: fixed; inset: 0; display: grid; place-items: center; }
  .s i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #8a847e55; border-top-color: #d97757; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body><div class="s"><i></i></div></body>
</html>
